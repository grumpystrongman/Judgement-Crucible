<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 860" role="img" aria-labelledby="title desc"><title id="title">Executive pressure room</title><desc id="desc">A dark cyber crisis command room showing conflicting executive priorities and a twenty second decision clock.</desc><defs><linearGradient id="b" x1="0" x2="1"><stop stop-color="#03080c"/><stop offset=".58" stop-color="#102531"/><stop offset="1" stop-color="#071117"/></linearGradient><radialGradient id="r"><stop stop-color="#ef4444" stop-opacity=".28"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/></radialGradient><pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" stroke="#60d9ef" stroke-opacity=".06" fill="none"/></pattern></defs><rect width="1536" height="860" fill="url(#b)"/><rect width="1536" height="860" fill="url(#g)"/><circle cx="1120" cy="430" r="430" fill="url(#r)"/><g transform="translate(820 125)" font-family="Arial, sans-serif"><rect width="570" height="486" rx="30" fill="#071017" stroke="#264c5d" stroke-width="2"/><text x="46" y="66" fill="#8be9fd" font-size="18" letter-spacing="4">EXECUTIVE PRESSURE</text><g transform="translate(46 105)"><rect width="478" height="78" rx="14" fill="#10222c"/><circle cx="39" cy="39" r="17" fill="#22d3ee"/><text x="76" y="35" fill="#e5f7fb" font-size="18" font-weight="700">COO</text><text x="76" y="59" fill="#9ebbc7" font-size="16">Keep care moving. No exceptions.</text></g><g transform="translate(46 201)"><rect width="478" height="78" rx="14" fill="#26151a" stroke="#ef4444" stroke-opacity=".35"/><circle cx="39" cy="39" r="17" fill="#ef4444"/><text x="76" y="35" fill="#fff1f2" font-size="18" font-weight="700">GENERAL COUNSEL</text><text x="76" y="59" fill="#d5a8ad" font-size="16">Assume compromise until disproven.</text></g><g transform="translate(46 297)"><rect width="478" height="78" rx="14" fill="#10222c"/><circle cx="39" cy="39" r="17" fill="#f59e0b"/><text x="76" y="35" fill="#fff7ed" font-size="18" font-weight="700">CEO</text><text x="76" y="59" fill="#d7bd91" font-size="16">Give me one defensible call.</text></g><g transform="translate(46 397)"><text x="0" y="35" fill="#f87171" font-size="18" letter-spacing="3">CHAIR DECISION</text><text x="470" y="39" text-anchor="end" fill="#fff" font-size="42" font-weight="800">00:20</text></g></g><g transform="translate(105 150)" font-family="Arial, sans-serif"><text fill="#f87171" font-size="18" letter-spacing="5">NO PERFECT ANSWER</text><text y="78" fill="#f8fafc" font-size="74" font-weight="800">WHAT DO YOU</text><text y="151" fill="#f8fafc" font-size="74" font-weight="800">PROTECT FIRST?</text><text y="217" fill="#a8c2cf" font-size="27">Choose the action. Name the tradeoff.</text><text y="257" fill="#a8c2cf" font-size="27">Own the trigger that changes your call.</text><path d="M0 327 H560" stroke="#294b59"/><text y="375" fill="#7dd3fc" font-size="18" letter-spacing="3">JUDGMENT UNDER PRESSURE</text></g></svg>